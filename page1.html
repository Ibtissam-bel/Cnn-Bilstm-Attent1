<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EmoDet</title>
<link rel="icon" type="image/png" href="logo.png">
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body{
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;

      /* Gradient Background */
      background: linear-gradient(
        to bottom,
        #bfe9ff 0%,
        #ffffff 50%,
        #bfe9ff 100%
      );
    }

    .container{
      text-align: center;
    }

    .logo{
      width: 180px;
      margin-bottom: 25px;
    }

    .btn{
      display: inline-block;
      padding: 14px 35px;
      background:#4682B4;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
      transition: 0.3s;
    }

    .btn:hover{
      background: #206fb0;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="logo.PNG" alt="Logo" class="logo">

    <br>

   <a href="index.html" class="btn">Get Started</a>
  </div>

</body>
</html>
